# Nombre de la aplicación
spring.application.name=ForoHub

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/forohub?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración de Flyway
spring.flyway.enabled=false

# Configuración de JWT
jwt.secret=${JWT_SECRET:my-secret-key}
jwt.issuer=ForoHub

# Configuración de logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.ForoHub=DEBUG
logging.level.com.example.ForoHub.controllers=DEBUG
logging.level.com.example.ForoHub.services=DEBUG
logging.level.com.example.ForoHub.repositories=DEBUG
logging.level.com.example.ForoHub.security=DEBUG

# Configuración del servidor
server.port=8080
